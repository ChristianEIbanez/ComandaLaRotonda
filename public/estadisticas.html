<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Estadísticas · La Rotonda</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#172033;--muted:#687386;--line:#e1e5eb;--orange:#e46b16;--blue:#315fc9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.head{background:#111827;color:#fff;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.brand{font-weight:950}.brand small{display:block;color:#aeb8c8;font-size:11px;margin-top:3px;letter-spacing:1px}
.actions{display:flex;gap:7px}.btn{border:1px solid #374151;border-radius:9px;padding:9px 12px;background:#1f2937;color:#fff;font-weight:900;cursor:pointer}.btn.light{background:#fff;color:#111827;border-color:#d4d9e1}
main{max-width:1450px;margin:auto;padding:20px}h1{margin:0;font-size:28px}.sub{color:var(--muted);margin:5px 0 16px}
.filters{display:flex;align-items:end;gap:9px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:15px}
.field{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:900;color:#626d7d}.field input{padding:9px;border:1px solid #ccd2da;border-radius:8px;font:inherit;color:#172033}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:13px}
.kpi{padding:14px}.kpi b{display:block;font-size:11px;color:#697384}.kpi strong{display:block;font-size:27px;margin-top:5px}.kpi span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px;margin-bottom:15px}.card{padding:15px}.card h2{font-size:18px;margin:0 0 4px}.card p{font-size:12px;color:var(--muted);margin:0 0 12px}
.bars{height:265px;display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding:10px 4px 25px;border-top:1px solid #edf0f3}
.bc{height:100%;min-width:34px;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}.bw{height:215px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar{width:min(34px,80%);background:var(--orange);border-radius:5px 5px 2px 2px;position:relative;min-height:2px}.bar i{position:absolute;top:-17px;width:100%;font-style:normal;font-size:9px;font-weight:900;text-align:center}.lab{font-size:9px;color:#657080;white-space:nowrap}
.rank{display:flex;flex-direction:column;gap:6px;max-height:390px;overflow:auto}.rr{display:grid;grid-template-columns:32px 1fr auto;gap:7px;align-items:center;border:1px solid #edf0f3;border-radius:8px;padding:8px}
.pos{font-weight:950;color:#7b8491}.name{font-weight:850;font-size:13px}.meta{font-size:10px;color:var(--muted);margin-top:2px}.num{font-weight:950;font-size:16px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px 5px;border-bottom:1px solid #edf0f3;font-size:12px}.table th{font-size:10px;color:#687386;text-align:left}.table td:not(:first-child),.table th:not(:first-child){text-align:right}
.product{width:100%;padding:9px;border:1px solid #ccd2da;border-radius:8px;margin-bottom:12px;font:inherit;font-weight:800}.prow{display:grid;grid-template-columns:105px 1fr 42px;gap:7px;align-items:center;margin:7px 0;font-size:11px}.track{height:20px;background:#eef1f5;border-radius:5px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:5px}.pnum{text-align:right;font-weight:950}
.empty,.loading{padding:25px;text-align:center;color:#758092;background:#f7f8fa;border-radius:9px}
@media(max-width:950px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){main{padding:11px}.head{padding:12px}.kpis{grid-template-columns:1fr 1fr}.kpi strong{font-size:22px}}
</style>
</head>
<body>
<header class="head">
  <div class="brand">DRUGSTORE LA ROTONDA<small>ANÁLISIS DE VENTAS · CANTIDADES</small></div>
  <div class="actions"><button class="btn" onclick="location.href='/'">← COMANDAS</button><button class="btn" id="logout">Cerrar sesión</button></div>
</header>
<main>
<h1>📊 Análisis de ventas</h1>
<div class="sub">Pedidos entregados y unidades vendidas. Sin precios ni costos.</div>
<div class="filters">
  <label class="field">MES<input id="mes" type="month"></label>
  <button class="btn light" id="mesBtn">ANALIZAR MES</button>
  <label class="field">DESDE<input id="desde" type="date"></label>
  <label class="field">HASTA<input id="hasta" type="date"></label>
  <button class="btn light" id="rangoBtn">ANALIZAR RANGO</button>
</div>
<div id="app"><div class="loading">Cargando análisis…</div></div>
</main>
<script>
var N={lunes:"Lunes",martes:"Martes",miércoles:"Miércoles",jueves:"Jueves",viernes:"Viernes",sábado:"Sábado",domingo:"Domingo"},D=null;
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(m){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])})}
function f(iso){var a=iso.split("-");return a[2]+"/"+a[1]+"/"+a[0]}
function fm(iso){var a=iso.split("-");return a[2]+"/"+a[1]}
function estado(){var p=new Intl.DateTimeFormat("en-US",{timeZone:"America/Argentina/Buenos_Aires",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",hour12:false}).formatToParts(new Date()),g=function(t){return p.find(function(x){return x.type===t}).value},y=+g("year"),m=+g("month"),d=+g("day"),h=+g("hour");if(h<2){var z=new Date(y,m-1,d-1);y=z.getFullYear();m=z.getMonth()+1;d=z.getDate()}return{mes:y+"-"+String(m).padStart(2,"0"),hoy:y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0")}}
function ultimo(m){var a=m.split("-");return new Date(+a[0],+a[1],0).toISOString().slice(0,10)}
async function cargar(a,b){document.getElementById("app").innerHTML='<div class="loading">Calculando análisis…</div>';try{var r=await fetch("/api/estadisticas/analisis?desde="+a+"&hasta="+b),x=await r.json();if(!r.ok||!x.ok)throw Error(x.mensaje||"No se pudo cargar");D=x;render()}catch(e){document.getElementById("app").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function render(){var x=D,mejor=x.rankingDias[0],sem=x.semana.slice().sort(function(a,b){return b.unidades-a.unidades||b.pedidos-a.pedidos})[0],max=Math.max.apply(null,x.dias.map(function(a){return a.unidades}).concat([1]));
document.getElementById("app").innerHTML=
'<div class="kpis"><div class="kpi"><b>PEDIDOS ENTREGADOS</b><strong>'+x.totalPedidos+'</strong><span>'+f(x.desde)+' → '+f(x.hasta)+'</span></div>'+
'<div class="kpi"><b>UNIDADES VENDIDAS</b><strong>'+x.totalUnidades+'</strong><span>'+x.productos.length+' productos diferentes</span></div>'+
'<div class="kpi"><b>MEJOR FECHA</b><strong>'+(mejor?f(mejor.fecha):"—")+'</strong><span>'+(mejor?mejor.unidades+" unidades · "+mejor.pedidos+" pedidos":"Sin ventas")+'</span></div>'+
'<div class="kpi"><b>MEJOR DÍA DE SEMANA</b><strong>'+(sem?N[sem.dia]:"—")+'</strong><span>'+(sem?sem.unidades+" unidades en el período":"Sin ventas")+'</span></div></div>'+
'<div class="grid"><div class="card"><h2>📅 Ventas por fecha</h2><p>Cada día del período seleccionado.</p><div class="bars">'+x.dias.map(function(a){var h=a.unidades?Math.max(3,Math.round(a.unidades/max*210)):2;return '<div class="bc"><div class="bw"><div class="bar" style="height:'+h+'px"><i>'+a.unidades+'</i></div></div><div class="lab">'+fm(a.fecha)+'</div></div>'}).join("")+'</div></div>'+
'<div class="card"><h2>🏆 Ranking de fechas</h2><p>Ordenado por unidades vendidas.</p><div class="rank">'+(x.rankingDias.length?x.rankingDias.slice(0,15).map(function(a){return '<div class="rr"><div class="pos">#'+a.puesto+'</div><div><div class="name">'+f(a.fecha)+' · '+N[a.diaSemana]+'</div><div class="meta">'+a.pedidos+' pedidos</div></div><div class="num">'+a.unidades+'</div></div>'}).join(""):'<div class="empty">Sin ventas.</div>')+'</div></div></div>'+
'<div class="grid"><div class="card"><h2>📆 Comparación por día de la semana</h2><p>Total y promedio por aparición en el período.</p><table class="table"><thead><tr><th>Día</th><th>Veces</th><th>Pedidos</th><th>Unidades</th><th>Promedio</th></tr></thead><tbody>'+x.semana.map(function(a){return '<tr><td>'+N[a.dia]+'</td><td>'+a.cantidadDias+'</td><td>'+a.pedidos+'</td><td>'+a.unidades+'</td><td>'+a.promedioUnidades+'</td></tr>'}).join("")+'</tbody></table></div>'+
'<div class="card"><h2>🍽️ Productos más vendidos</h2><p>Ranking por unidades.</p><div class="rank">'+(x.productos.length?x.productos.slice(0,12).map(function(a){return '<div class="rr"><div class="pos">#'+a.puesto+'</div><div><div class="name">'+esc(a.nombre)+'</div><div class="meta">'+a.pedidos+' pedidos</div></div><div class="num">'+a.unidades+'</div></div>'}).join(""):'<div class="empty">Sin productos.</div>')+'</div></div></div>'+
'<div class="grid"><div class="card"><h2>🔎 Un producto según el día</h2><p>Compará un producto entre lunes y domingo.</p><select id="producto" class="product">'+x.productos.map(function(a){return '<option value="'+esc(a.nombre)+'">'+esc(a.nombre)+'</option>'}).join("")+'</select><div id="prodSemana"></div></div>'+
'<div class="card"><h2>📋 Ranking completo de productos</h2><p>Todos los productos del período.</p><div class="rank">'+(x.productos.length?x.productos.map(function(a){return '<div class="rr"><div class="pos">#'+a.puesto+'</div><div class="name">'+esc(a.nombre)+'</div><div class="num">'+a.unidades+'</div></div>'}).join(""):'<div class="empty">Sin productos.</div>')+'</div></div></div>';
if(document.getElementById("producto")){document.getElementById("producto").onchange=productoSemana;productoSemana()}}
function productoSemana(){var n=document.getElementById("producto").value,arr=D.semana.map(function(a){var z=(D.productosPorDiaSemana[a.dia]||[]).find(function(p){return p.producto===n});return{dia:a.dia,unidades:z?z.unidades:0}}),mx=Math.max.apply(null,arr.map(function(a){return a.unidades}).concat([1]));document.getElementById("prodSemana").innerHTML=arr.map(function(a){return '<div class="prow"><div>'+N[a.dia]+'</div><div class="track"><div class="fill" style="width:'+Math.round(a.unidades/mx*100)+'%"></div></div><div class="pnum">'+a.unidades+'</div></div>'}).join("")}
document.getElementById("mesBtn").onclick=function(){var m=document.getElementById("mes").value;if(!m)return;var e=estado(),fin=m===e.mes?e.hoy:ultimo(m);cargar(m+"-01",fin)};
document.getElementById("rangoBtn").onclick=function(){var a=document.getElementById("desde").value,b=document.getElementById("hasta").value;if(!a||!b)return alert("Elegí las dos fechas.");if(a>b)return alert("DESDE no puede ser posterior a HASTA.");cargar(a,b)};
document.getElementById("logout").onclick=async function(){try{await fetch("/api/logout",{method:"POST"})}finally{location.href="/login.html?redirect=/estadisticas.html"}};
var e=estado();document.getElementById("mes").value=e.mes;document.getElementById("desde").value=e.mes+"-01";document.getElementById("hasta").value=e.hoy;cargar(e.mes+"-01",e.hoy);
</script>
</body></html>
