<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina - Comandas</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0d0d;color:#fff;font-family:Arial,Helvetica,sans-serif}
header{padding:12px 20px;background:#050505;border-bottom:1px solid #2b2b2b;display:flex;justify-content:space-between;align-items:center;gap:18px;position:sticky;top:0;z-index:10}
.header-left{display:flex;align-items:center;gap:20px;min-width:0}
.titulo{font-size:28px;font-weight:900;letter-spacing:.3px}
.reloj{font-size:20px;font-weight:800;white-space:nowrap}
.header-actions{display:flex;align-items:center;gap:10px}
.btn-sonido,.btn-logout{width:auto;margin:0;padding:10px 13px;border:1px solid #444;border-radius:8px;background:#171717;color:#fff;font-size:13px;font-weight:900}
.btn-sonido.activo{border-color:#4caf50}
main{padding:20px;max-width:1920px;margin:auto}
.seccion{margin-bottom:32px}
.seccion h2{margin:0 0 14px;font-size:24px;font-weight:900}
.contador{font-size:15px;color:#aaa;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:18px;align-items:start}
.pedido{background:#181818;border:2px solid #383838;border-radius:15px;padding:17px;box-shadow:0 5px 18px rgba(0,0,0,.22)}
.pedido.ahora{border-color:#fff}
.pedido.proximamente{opacity:.68}
.pedido.preparar{border-width:3px}
.pedido.urgente{border-width:4px}
.pedido.demorado{border-width:4px}
.pedido.nueva{animation:nuevaComanda 1s ease-in-out 5;box-shadow:0 0 0 2px #fff}
.pedido.en-marcha{border-color:#5aa9ff}

@keyframes nuevaComanda{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.012)}
}

.cabecera{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px
}

.numero{
    font-size:40px;
    line-height:1;
    font-weight:900
}

.estado{
    font-size:15px;
    font-weight:900;
    border:1px solid #555;
    border-radius:8px;
    padding:8px 10px;
    text-align:center;
    white-space:nowrap
}

.contexto{
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
    margin-top:9px;
    padding-bottom:11px;
    border-bottom:1px solid #303030
}

.destino,.cliente{
    font-size:17px;
    font-weight:900
}

.horario{
    font-size:16px;
    font-weight:900;
    margin:11px 0 0
}

.meta{
    font-size:12px;
    color:#8f8f8f;
    margin:5px 0 8px
}

.tiempo-pedido{
    font-size:15px;
    color:#aaa;
    font-weight:800;
    margin:10px 0 4px
}

.meta strong{
    color:#c9c9c9
}

.productos{
    margin-top:9px
}

.producto{
    padding:15px 0 13px;
    border-top:2px solid #3a3a3a
}

.producto:last-child{
    border-bottom:1px solid #333
}

.producto strong{
    display:block;
    font-size:29px;
    line-height:1.12;
    font-weight:900
}

.cantidad{
    font-size:38px;
    font-weight:900;
    margin-right:7px
}

.nombre-producto{
    font-size:29px;
    font-weight:900
}

.detalle{
    font-size:17px;
    color:#eee;
    margin-top:7px;
    line-height:1.4;
    font-weight:700
}

.observacion{
    margin-top:14px;
    padding:13px;
    border-radius:9px;
    background:#292929;
    border-left:5px solid #fff;
    font-size:18px;
    line-height:1.4;
    font-weight:900
}

button{
    width:100%;
    border:0;
    border-radius:9px;
    padding:16px;
    margin-top:14px;
    font-size:17px;
    font-weight:900;
    cursor:pointer
}

.btn-listo,.btn-entregado{
    background:#fff;
    color:#111
}

.btn-marchar{
    background:#ffd54a;
    color:#111
}

.vacio{
    color:#888;
    font-size:17px;
    padding:12px 0
}

@media(max-width:900px){
    .grid{
        grid-template-columns:1fr
    }

    .titulo{
        font-size:22px
    }

    .reloj{
        font-size:18px
    }
}

@media(max-width:650px){
    header{
        flex-wrap:wrap
    }

    .header-left{
        width:100%;
        justify-content:space-between
    }

    .header-actions{
        width:100%
    }

    .btn-sonido,.btn-logout{
        flex:1
    }

    main{
        padding:12px
    }

    .pedido{
        padding:14px
    }

    .producto strong,.nombre-producto{
        font-size:25px
    }

    .cantidad{
        font-size:33px
    }
}
</style>
</head>

<body>

<header>
    <div class="titulo">COCINA — COMANDAS</div>
    <div id="reloj" class="reloj"></div>
</header>

<main>

<section class="seccion">
    <h2>
        🟡 POR PREPARAR
        <span id="contadorPendientes" class="contador"></span>
    </h2>

    <div id="pendientes" class="grid"></div>

    <div id="vacioPendientes" class="vacio">
        No hay pedidos pendientes.
    </div>
</section>


<section class="seccion">
    <h2>
        🔵 EN MARCHA
        <span id="contadorEnMarcha" class="contador"></span>
    </h2>

    <div id="enMarcha" class="grid"></div>

    <div id="vacioEnMarcha" class="vacio">
        No hay pedidos en marcha.
    </div>
</section>


<section class="seccion">
    <h2>
        🟢 LISTOS PARA ENTREGAR
        <span id="contadorListos" class="contador"></span>
    </h2>

    <div id="listos" class="grid"></div>

    <div id="vacioListos" class="vacio">
        No hay pedidos esperando retiro.
    </div>
</section>

</main>


<script>

let pedidos = [];

const TIEMPO_PREPARACION = 20;

const pendientes = document.getElementById("pendientes");
const enMarcha = document.getElementById("enMarcha");
const listos = document.getElementById("listos");


// ======================================================
// SEGURIDAD HTML
// ======================================================

function escapeHtml(text){
    return String(text ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


// ======================================================
// FECHAS
// ======================================================

function fechaLocal(iso){
    return new Date(iso);
}

function minutosHasta(date){
    return Math.round(
        (date.getTime() - Date.now()) / 60000
    );
}

function formatoDuracion(ms){

    const totalMinutos = Math.max(
        0,
        Math.ceil(ms / 60000)
    );

    const dias = Math.floor(totalMinutos / 1440);

    const horas = Math.floor(
        (totalMinutos % 1440) / 60
    );

    const minutos = totalMinutos % 60;

    const partes = [];

    if(dias > 0){
        partes.push(
            `${dias} ${dias === 1 ? "día" : "días"}`
        );
    }

    if(horas > 0){
        partes.push(
            `${horas} ${horas === 1 ? "hora" : "horas"}`
        );
    }

    if(minutos > 0 || partes.length === 0){
        partes.push(
            `${minutos} ${minutos === 1 ? "minuto" : "minutos"}`
        );
    }

    if(partes.length === 1){
        return partes[0];
    }

    if(partes.length === 2){
        return `${partes[0]} y ${partes[1]}`;
    }

    return `${partes[0]}, ${partes[1]} y ${partes[2]}`;
}


// ======================================================
// TIEMPO DESDE QUE LLEGÓ EL PEDIDO
// ======================================================

function fechaPedido(pedido){
    return new Date(pedido.creadoAt);
}

function tiempoDesdePedido(pedido){

    const creado = fechaPedido(pedido);

    const minutos = Math.floor(
        Math.max(
            0,
            Date.now() - creado.getTime()
        ) / 60000
    );

    if(minutos === 0){
        return "AHORA";
    }

    if(minutos < 60){
        return `Hace ${minutos} ${
            minutos === 1 ? "minuto" : "minutos"
        }`;
    }

    const horas = Math.floor(minutos / 60);

    const minutosRestantes = minutos % 60;

    if(minutosRestantes === 0){
        return `Hace ${horas} ${
            horas === 1 ? "hora" : "horas"
        }`;
    }

    return `Hace ${horas} ${
        horas === 1 ? "hora" : "horas"
    } y ${minutosRestantes} ${
        minutosRestantes === 1 ? "minuto" : "minutos"
    }`;
}


// ======================================================
// URGENCIA
// ======================================================

function datosUrgencia(pedido){

    if(
        pedido.modoRetiro !== "programado" ||
        !pedido.retiroAt
    ){
        return {
            clase:"ahora",
            texto:"AHORA",
            prioridad:0,
            detalle:""
        };
    }

    const retiro = fechaLocal(pedido.retiroAt);

    const inicio = new Date(
        retiro.getTime() -
        TIEMPO_PREPARACION * 60000
    );

    const faltanRetiro = minutosHasta(retiro);

    if(faltanRetiro < 0){

        return {
            clase:"demorado",
            texto:"🚨 DEMORADO",
            prioridad:-4,
            detalle:"La hora de retiro ya pasó"
        };
    }

    if(faltanRetiro <= 10){

        return {
            clase:"urgente",
            texto:"🚨 URGENTE",
            prioridad:-3,
            detalle:`Retiro en ${Math.max(
                0,
                faltanRetiro
            )} min`
        };
    }

    if(Date.now() >= inicio.getTime()){

        return {
            clase:"preparar",
            texto:"🔴 PREPARAR AHORA",
            prioridad:-2,
            detalle:`Debe estar listo para ${
                formatoHora(retiro)
            }`
        };
    }

    return {
        clase:"proximamente",
        texto:"🟡 PRÓXIMAMENTE",
        prioridad:1,
        detalle:`Comenzar en ${
            formatoDuracion(
                inicio.getTime() - Date.now()
            )
        }`
    };
}


function formatoHora(date){

    return date.toLocaleTimeString(
        "es-AR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


function formatoFecha(date){

    return date.toLocaleDateString(
        "es-AR",
        {
            day:"2-digit",
            month:"2-digit"
        }
    );
}


// ======================================================
// ORDENAR PEDIDOS PENDIENTES
// ======================================================

function prioridad(pedido){

    const retiro = pedido.retiroAt
        ? new Date(pedido.retiroAt).getTime()
        : 0;

    const creado =
        new Date(pedido.creadoAt).getTime();

    if(pedido.modoRetiro !== "programado"){
        return [0,0,creado];
    }

    const inicio =
        retiro - TIEMPO_PREPARACION * 60000;

    if(Date.now() >= inicio){
        return [
            1,
            Math.max(0,retiro-Date.now()),
            creado
        ];
    }

    return [
        2,
        inicio-Date.now(),
        creado
    ];
}


function ordenarPendientes(lista){

    return lista.sort((a,b)=>{

        const pa = prioridad(a);
        const pb = prioridad(b);

        for(let i=0;i<pa.length;i++){

            if(pa[i] !== pb[i]){
                return pa[i] - pb[i];
            }
        }

        return 0;
    });
}


// ======================================================
// RENDER GENERAL
// ======================================================

function render(){

    const activos =
        pedidos.filter(
            p => p.estado !== "entregado"
        );

    const peds =
        ordenarPendientes(
            activos.filter(
                p => p.estado === "pendiente"
            )
        );

    const marcha =
        activos
            .filter(
                p => p.estado === "en_marcha"
            )
            .sort(
                (a,b)=>
                    new Date(a.creadoAt) -
                    new Date(b.creadoAt)
            );

    const list =
        activos
            .filter(
                p => p.estado === "listo"
            )
            .sort(
                (a,b)=>
                    new Date(
                        a.listoAt || a.creadoAt
                    ) -
                    new Date(
                        b.listoAt || b.creadoAt
                    )
            );


    pendientes.innerHTML =
        peds.map(
            renderPedidoPendiente
        ).join("");

    enMarcha.innerHTML =
        marcha.map(
            renderPedidoEnMarcha
        ).join("");

    listos.innerHTML =
        list.map(
            renderPedidoListo
        ).join("");


    document.getElementById(
        "vacioPendientes"
    ).style.display =
        peds.length ? "none" : "block";


    document.getElementById(
        "vacioEnMarcha"
    ).style.display =
        marcha.length ? "none" : "block";


    document.getElementById(
        "vacioListos"
    ).style.display =
        list.length ? "none" : "block";


    document.getElementById(
        "contadorPendientes"
    ).textContent =
        `(${peds.length})`;


    document.getElementById(
        "contadorEnMarcha"
    ).textContent =
        `(${marcha.length})`;


    document.getElementById(
        "contadorListos"
    ).textContent =
        `(${list.length})`;
}


// ======================================================
// PRODUCTOS
// ======================================================

function renderProductos(pedido){

    return pedido.productos.map(p=>{

        let detalles = [];

        if(p.preparacion){
            detalles.push(p.preparacion);
        }

        if(p.guarnicion){
            detalles.push(
                "Guarnición: " +
                p.guarnicion
            );
        }

        detalles.push(
            ...(p.modificaciones || [])
        );

        detalles.push(
            ...(p.adicionales || [])
                .map(
                    a => "+ " + a
                )
        );


        return `
        <div class="producto">

            <strong>
                <span class="cantidad">
                    ${p.cantidad} ×
                </span>

                <span class="nombre-producto">
                    ${escapeHtml(p.nombre)}
                </span>
            </strong>

            ${
                detalles.length
                ? `
                    <div class="detalle">
                        ${detalles
                            .map(escapeHtml)
                            .join(" · ")}
                    </div>
                  `
                : ""
            }

        </div>
        `;

    }).join("");
}


// ======================================================
// PEDIDO POR PREPARAR
// ======================================================

function renderPedidoPendiente(pedido){

    const u =
        datosUrgencia(pedido);

    return `
    <article
        class="pedido ${u.clase}"
        data-pedido-numero="${pedido.numero}"
    >

        <div class="cabecera">

            <div class="numero">
                #${pedido.numero}
            </div>

            <div class="estado">
                ${u.texto}
            </div>

        </div>


        <div class="contexto">

            <div class="destino">
                ${escapeHtml(pedido.destino)}
            </div>

            ${
                pedido.cliente
                ? `
                    <div class="cliente">
                        👤 ${escapeHtml(
                            pedido.cliente
                        )}
                    </div>
                  `
                : ""
            }

        </div>


        ${
            pedido.modoRetiro === "programado" &&
            pedido.retiroAt
            ? `
                <div class="horario">
                    📅 Retiro:
                    ${formatoFecha(
                        new Date(pedido.retiroAt)
                    )}
                    ${formatoHora(
                        new Date(pedido.retiroAt)
                    )}
                </div>
              `
            : ""
        }


        <div class="tiempo-pedido">
            ${tiempoDesdePedido(pedido)}
        </div>


        ${
            pedido.modoRetiro === "programado"
            ? `
                <div class="meta">
                    <strong>
                        ${escapeHtml(u.detalle)}
                    </strong>
                </div>
              `
            : ""
        }


        <div class="productos">
            ${renderProductos(pedido)}
        </div>


        ${
            pedido.observacion
            ? `
                <div class="observacion">
                    ⚠️ ${escapeHtml(
                        pedido.observacion
                    )}
                </div>
              `
            : ""
        }


        <button
            class="btn-marchar"
            onclick="marcharPedido(${pedido.numero})"
        >
            ▶ MARCHAR
        </button>

    </article>
    `;
}


// ======================================================
// PEDIDO EN MARCHA
// ======================================================

function renderPedidoEnMarcha(pedido){

    return `
    <article
        class="pedido en-marcha"
        data-pedido-numero="${pedido.numero}"
    >

        <div class="cabecera">

            <div class="numero">
                #${pedido.numero}
            </div>

            <div class="estado">
                🔵 EN MARCHA
            </div>

        </div>


        <div class="contexto">

            <div class="destino">
                ${escapeHtml(pedido.destino)}
            </div>

            ${
                pedido.cliente
                ? `
                    <div class="cliente">
                        👤 ${escapeHtml(
                            pedido.cliente
                        )}
                    </div>
                  `
                : ""
            }

        </div>


        ${
            pedido.modoRetiro === "programado" &&
            pedido.retiroAt
            ? `
                <div class="horario">
                    📅 Retiro:
                    ${formatoFecha(
                        new Date(pedido.retiroAt)
                    )}
                    ${formatoHora(
                        new Date(pedido.retiroAt)
                    )}
                </div>
              `
            : ""
        }


        <div class="tiempo-pedido">
            ${tiempoDesdePedido(pedido)}
        </div>


        <div class="productos">
            ${renderProductos(pedido)}
        </div>


        ${
            pedido.observacion
            ? `
                <div class="observacion">
                    ⚠️ ${escapeHtml(
                        pedido.observacion
                    )}
                </div>
              `
            : ""
        }


        <button
            class="btn-listo"
            onclick="marcarListo(${pedido.numero})"
        >
            ✓ PEDIDO LISTO
        </button>

    </article>
    `;
}


// ======================================================
// PEDIDO LISTO
// ======================================================

function renderPedidoListo(pedido){

    const listo =
        pedido.listoAt
        ? new Date(pedido.listoAt)
        : new Date();

    const espera =
        Math.max(
            0,
            Math.floor(
                (
                    Date.now() -
                    listo.getTime()
                ) / 60000
            )
        );


    return `
    <article
        class="pedido"
        data-pedido-numero="${pedido.numero}"
    >

        <div class="cabecera">

            <div class="numero">
                #${pedido.numero}
            </div>

            <div class="estado">
                🟢 LISTO
            </div>

        </div>


        <div class="contexto">

            <div class="destino">
                ${escapeHtml(pedido.destino)}
            </div>

            ${
                pedido.cliente
                ? `
                    <div class="cliente">
                        👤 ${escapeHtml(
                            pedido.cliente
                        )}
                    </div>
                  `
                : ""
            }

        </div>


        ${
            pedido.modoRetiro === "programado" &&
            pedido.retiroAt
            ? `
                <div class="horario">
                    📅 Retiro:
                    ${formatoHora(
                        new Date(
                            pedido.retiroAt
                        )
                    )}
                </div>
              `
            : ""
        }


        <div class="meta">
            Esperando retiro: ${espera} min
        </div>


        <div class="productos">
            ${renderProductos(pedido)}
        </div>


        ${
            pedido.observacion
            ? `
                <div class="observacion">
                    ⚠️ ${escapeHtml(
                        pedido.observacion
                    )}
                </div>
              `
            : ""
        }


        <button
            class="btn-entregado"
            onclick="marcarEntregado(${pedido.numero})"
        >
            📦 PEDIDO ENTREGADO
        </button>

    </article>
    `;
}


// ======================================================
// CAMBIO DE ESTADO
// ======================================================

async function cambiarEstado(numero,url){

    const respuesta =
        await fetch(
            url,
            {
                method:"POST"
            }
        );

    const resultado =
        await respuesta.json();

    if(!resultado.ok){

        alert(
            resultado.mensaje ||
            "No se pudo actualizar el pedido."
        );
    }
}


// ======================================================
// MARCHAR
// ======================================================

async function marcharPedido(numero){

    await cambiarEstado(
        numero,
        `/api/pedidos/${numero}/marchar`
    );
}


// ======================================================
// LISTO
// ======================================================

async function marcarListo(numero){

    await cambiarEstado(
        numero,
        `/api/pedidos/${numero}/listo`
    );
}


// ======================================================
// ENTREGADO
// ======================================================

async function marcarEntregado(numero){

    await cambiarEstado(
        numero,
        `/api/pedidos/${numero}/entregado`
    );
}


// ======================================================
// SONIDO
// ======================================================

let audioContext = null;
let sonidoActivo = false;


async function activarAudio(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }


        if(
            audioContext.state !==
            "running"
        ){

            await audioContext.resume();
        }


        sonidoActivo =
            audioContext.state ===
            "running";


        const boton =
            document.getElementById(
                "btnSonido"
            );


        if(
            boton &&
            sonidoActivo
        ){

            boton.textContent =
                "🔊 SONIDO ACTIVO";

            boton.classList.add(
                "activo"
            );
        }


        return sonidoActivo;

    }catch(error){

        console.error(
            "No se pudo activar el audio:",
            error
        );

        return false;
    }
}

    const activo =
        await activarAudio();

    if(
        !activo ||
        !audioContext
    ){
        return;
    }


    const ahora =
        audioContext.currentTime;


    const notas = [

        {
            frecuencia:880,
            inicio:0
        },

        {
            frecuencia:1174,
            inicio:0.18
        }

    ];


    notas.forEach(nota=>{

        const oscilador =
            audioContext.createOscillator();

        const ganancia =
            audioContext.createGain();


        const inicio =
            ahora + nota.inicio;


        oscilador.type =
            "sine";


        oscilador.frequency
            .setValueAtTime(
                nota.frecuencia,
                inicio
            );


        ganancia.gain
            .setValueAtTime(
                0.0001,
                inicio
            );


        ganancia.gain
            .exponentialRampToValueAtTime(
                0.28,
                inicio + 0.025
            );


        ganancia.gain
            .exponentialRampToValueAtTime(
                0.0001,
                inicio + 0.20
            );


        oscilador.connect(
            ganancia
        );

        ganancia.connect(
            audioContext.destination
        );


        oscilador.start(
            inicio
        );

        oscilador.stop(
            inicio + 0.21
        );

    });
}


// ======================================================
// EVENTOS EN TIEMPO REAL
// ======================================================

const eventos =
    new EventSource(
        "/api/cocina"
    );


eventos.onmessage = event =>{

    const data =
        JSON.parse(event.data);


    if(data.tipo === "inicio"){

        pedidos =
            data.pedidos;

        render();

        return;
    }


    if(data.pedido){

        const indice =
            pedidos.findIndex(
                p =>
                    p.numero ===
                    data.pedido.numero
            );


        const esNueva =
            indice === -1;


        if(esNueva){

            pedidos.push(
                data.pedido
            );

        }else{

            pedidos[indice] =
                data.pedido;
        }


        if(
            data.pedido.estado ===
            "entregado"
        ){

            pedidos =
                pedidos.filter(
                    p =>
                        p.numero !==
                        data.pedido.numero
                );
        }


        render();


        if(
            esNueva &&
            data.pedido.estado ===
            "pendiente"
        ){

            sonidoNuevaComanda();


            const tarjeta =
                document.querySelector(
                    `[data-pedido-numero="${data.pedido.numero}"]`
                );


            if(tarjeta){

                tarjeta.classList.add(
                    "nueva"
                );


                setTimeout(
                    () => {

                        tarjeta.classList.remove(
                            "nueva"
                        );

                    },
                    5200
                );
            }
        }
    }
};


eventos.onerror = () =>{

    // EventSource intenta
    // reconectar automáticamente.

};


// Actualizar tiempos cada minuto.

setInterval(
    () => render(),
    60000
);


// Actualizar reloj.

setInterval(()=>{

    document.getElementById(
        "reloj"
    ).textContent =

        new Date().toLocaleTimeString(
            "es-AR",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );

    render();

},1000);


render();
