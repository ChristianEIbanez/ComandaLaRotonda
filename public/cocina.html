<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina - Comandas</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif}
header{padding:18px 22px;background:#050505;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;gap:15px}
.titulo{font-size:28px;font-weight:900}
.reloj{font-size:22px;font-weight:800}
main{padding:18px;max-width:1700px;margin:auto}
.seccion{margin-bottom:26px}
.seccion h2{margin:0 0 12px;font-size:23px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.pedido{background:#1c1c1c;border:2px solid #333;border-radius:14px;padding:15px}
.pedido.ahora{border-color:#fff}
.pedido.proximamente{opacity:.8}
.pedido.preparar{border-width:3px}
.pedido.urgente{border-width:4px}
.pedido.demorado{border-width:4px}
.cabecera{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.numero{font-size:30px;font-weight:900}
.destino{font-size:18px;font-weight:900;margin-top:3px}
.cliente{font-size:18px;font-weight:900;margin-top:5px}
.estado{font-size:15px;font-weight:900;border:1px solid #555;border-radius:7px;padding:7px 9px;text-align:center}
.horario{font-size:17px;font-weight:900;margin:13px 0}
.meta{font-size:13px;color:#bbb;margin-bottom:10px}
.producto{padding:9px 0;border-top:1px solid #333}
.producto strong{font-size:17px}
.detalle{font-size:14px;color:#ddd;margin-top:4px;line-height:1.45}
.observacion{margin-top:12px;padding:10px;border-radius:8px;background:#292929;font-size:14px}
button{width:100%;border:0;border-radius:9px;padding:14px;margin-top:12px;font-size:16px;font-weight:900;cursor:pointer}
.btn-listo{background:#fff;color:#111}
.btn-entregado{background:#fff;color:#111}
.vacio{color:#aaa;font-size:17px;padding:12px 0}
.contador{font-size:14px;color:#aaa;font-weight:700}
@media(max-width:700px){.grid{grid-template-columns:1fr}.titulo{font-size:22px}}
</style>
</head>
<body>
<header>
<div class="titulo">COCINA — COMANDAS</div>
<div id="reloj" class="reloj"></div>
</header>

<main>
<section class="seccion">
<h2>🔴 EN PREPARACIÓN <span id="contadorPendientes" class="contador"></span></h2>
<div id="pendientes" class="grid"></div>
<div id="vacioPendientes" class="vacio">No hay pedidos pendientes.</div>
</section>

<section class="seccion">
<h2>🟢 LISTOS PARA ENTREGAR <span id="contadorListos" class="contador"></span></h2>
<div id="listos" class="grid"></div>
<div id="vacioListos" class="vacio">No hay pedidos esperando retiro.</div>
</section>
</main>

<script>
let pedidos = [];

const TIEMPO_PREPARACION = 20;

const pendientes = document.getElementById("pendientes");
const listos = document.getElementById("listos");

function escapeHtml(text){
    return String(text ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function fechaLocal(iso){
    return new Date(iso);
}

function minutosHasta(date){
    return Math.round((date.getTime() - Date.now()) / 60000);
}

function tieneEmpanadas(pedido){
    return pedido.productos.some(p => p.nombre.toLowerCase().includes("empanada"));
}

function datosUrgencia(pedido){
    if (pedido.modoRetiro !== "programado" || !pedido.retiroAt){
        return {
            clase:"ahora",
            texto:"AHORA",
            prioridad:0,
            detalle:"Preparar cuanto antes"
        };
    }

    const retiro = fechaLocal(pedido.retiroAt);
    const inicio = new Date(retiro.getTime() - TIEMPO_PREPARACION * 60000);
    const faltanRetiro = minutosHasta(retiro);

    if (faltanRetiro < 0){
        return {
            clase:"demorado",
            texto:"🚨 DEMORADO",
            prioridad:-4,
            detalle:"La hora de retiro ya pasó"
        };
    }

    if (faltanRetiro <= 10){
        return {
            clase:"urgente",
            texto:"🚨 URGENTE",
            prioridad:-3,
            detalle:`Retiro en ${Math.max(0,faltanRetiro)} min`
        };
    }

    if (Date.now() >= inicio.getTime()){
        return {
            clase:"preparar",
            texto:"🔴 PREPARAR AHORA",
            prioridad:-2,
            detalle:`Debe estar listo para ${formatoHora(retiro)}`
        };
    }

    const faltanInicio = Math.ceil((inicio.getTime() - Date.now()) / 60000);

    return {
        clase:"proximamente",
        texto:"🟡 PRÓXIMAMENTE",
        prioridad:1,
        detalle:`Comenzar aprox. en ${faltanInicio} min`
    };
}

function formatoHora(date){
    return date.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
}

function formatoFecha(date){
    return date.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"});
}

function fechaPedido(pedido){
    return new Date(pedido.creadoAt);
}

function prioridad(pedido){
    const u = datosUrgencia(pedido);
    const retiro = pedido.retiroAt ? new Date(pedido.retiroAt).getTime() : 0;
    const creado = new Date(pedido.creadoAt).getTime();

    if (pedido.modoRetiro !== "programado") {
        return [0, 0, creado];
    }

    const inicio = retiro - TIEMPO_PREPARACION * 60000;

    // Los programados que ya deben comenzar se colocan antes que los que aún esperan.
    if (Date.now() >= inicio) {
        return [1, Math.max(0,retiro-Date.now()), creado];
    }

    return [2, inicio-Date.now(), creado];
}

function ordenarPendientes(lista){
    return lista.sort((a,b)=>{
        const pa = prioridad(a);
        const pb = prioridad(b);

        for(let i=0;i<pa.length;i++){
            if(pa[i] !== pb[i]) return pa[i] - pb[i];
        }
        return 0;
    });
}

function render(){
    const activos = pedidos.filter(p => p.estado !== "entregado");
    const peds = ordenarPendientes(activos.filter(p => p.estado === "pendiente"));
    const list = activos.filter(p => p.estado === "listo")
        .sort((a,b)=>new Date(a.listoAt||a.creadoAt)-new Date(b.listoAt||b.creadoAt));

    pendientes.innerHTML = peds.map(renderPedidoPendiente).join("");
    listos.innerHTML = list.map(renderPedidoListo).join("");

    document.getElementById("vacioPendientes").style.display = peds.length ? "none" : "block";
    document.getElementById("vacioListos").style.display = list.length ? "none" : "block";

    document.getElementById("contadorPendientes").textContent = `(${peds.length})`;
    document.getElementById("contadorListos").textContent = `(${list.length})`;
}

function renderProductos(pedido){
    return pedido.productos.map(p=>{
        let detalles = [];
        if(p.preparacion) detalles.push(p.preparacion);
        if(p.guarnicion) detalles.push("Guarnición: "+p.guarnicion);
        detalles.push(...(p.modificaciones||[]));
        detalles.push(...(p.adicionales||[]).map(a=>"+ "+a));

        return `
        <div class="producto">
            <strong>${p.cantidad} × ${escapeHtml(p.nombre)}</strong>
            ${detalles.length ? `<div class="detalle">${detalles.map(escapeHtml).join(" · ")}</div>` : ""}
        </div>`;
    }).join("");
}

function renderPedidoPendiente(pedido){
    const u = datosUrgencia(pedido);

    const retiro = pedido.modoRetiro === "programado" && pedido.retiroAt
        ? `<div class="horario">📅 Retiro: ${formatoFecha(new Date(pedido.retiroAt))} ${formatoHora(new Date(pedido.retiroAt))}</div>`
        : `<div class="horario">🕐 AHORA</div>`;

    return `
    <article class="pedido ${u.clase}">
        <div class="cabecera">
            <div>
                <div class="numero">#${pedido.numero}</div>
                <div class="destino">${escapeHtml(pedido.destino)}</div>
                ${pedido.cliente ? `<div class="cliente">👤 ${escapeHtml(pedido.cliente)}</div>` : ""}
            </div>
            <div class="estado">${u.texto}</div>
        </div>

        ${retiro}
        <div class="meta">Pedido realizado: ${fechaPedido(pedido).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div>
        <div class="meta">${escapeHtml(u.detalle)}</div>

        ${renderProductos(pedido)}

        ${pedido.observacion ? `<div class="observacion">📝 ${escapeHtml(pedido.observacion)}</div>` : ""}

        <button class="btn-listo" onclick="marcarListo(${pedido.numero})">✅ PEDIDO LISTO</button>
    </article>`;
}

function renderPedidoListo(pedido){
    const listo = pedido.listoAt ? new Date(pedido.listoAt) : new Date();
    const espera = Math.max(0,Math.floor((Date.now()-listo.getTime())/60000));

    return `
    <article class="pedido">
        <div class="cabecera">
            <div>
                <div class="numero">#${pedido.numero}</div>
                <div class="destino">${escapeHtml(pedido.destino)}</div>
                ${pedido.cliente ? `<div class="cliente">👤 ${escapeHtml(pedido.cliente)}</div>` : ""}
            </div>
            <div class="estado">🟢 LISTO</div>
        </div>

        ${pedido.modoRetiro === "programado" && pedido.retiroAt
            ? `<div class="horario">📅 Retiro: ${formatoHora(new Date(pedido.retiroAt))}</div>`
            : `<div class="horario">🕐 AHORA</div>`}

        <div class="meta">Esperando retiro: ${espera} min</div>
        ${renderProductos(pedido)}
        ${pedido.observacion ? `<div class="observacion">📝 ${escapeHtml(pedido.observacion)}</div>` : ""}

        <button class="btn-entregado" onclick="marcarEntregado(${pedido.numero})">📦 PEDIDO ENTREGADO</button>
    </article>`;
}

async function cambiarEstado(numero,url){
    const respuesta = await fetch(url,{method:"POST"});
    const resultado = await respuesta.json();

    if(!resultado.ok){
        alert(resultado.mensaje || "No se pudo actualizar el pedido.");
    }
}

async function marcarListo(numero){
    await cambiarEstado(numero,`/api/pedidos/${numero}/listo`);
}

async function marcarEntregado(numero){
    await cambiarEstado(numero,`/api/pedidos/${numero}/entregado`);
}

const eventos = new EventSource("/api/cocina");

eventos.onmessage = event => {
    const data = JSON.parse(event.data);

    if(data.tipo === "inicio"){
        pedidos = data.pedidos;
    } else if(data.pedido){
        const indice = pedidos.findIndex(p => p.numero === data.pedido.numero);

        if(indice === -1) pedidos.push(data.pedido);
        else pedidos[indice] = data.pedido;

        if(data.pedido.estado === "entregado"){
            pedidos = pedidos.filter(p => p.numero !== data.pedido.numero);
        }
    }

    render();
};

eventos.onerror = () => {
    // EventSource intenta reconectar automáticamente.
};

setInterval(()=>{
    document.getElementById("reloj").textContent =
        new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    render();
},1000);

render();
</script>
</body>
</html>
