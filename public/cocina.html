<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina · Comanda 2.0</title>
<style>
:root{
  --bg:#07090b;--panel:#0f1317;--panel2:#14191e;--line:#293139;--text:#f5f7f8;--muted:#8d98a2;
  --orange:#ff7a00;--yellow:#f5c542;--blue:#238bea;--green:#20b15a;--red:#ef4444;--purple:#9b87f5;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
button{font:inherit}
body{display:flex;flex-direction:column}
.header{
  flex:0 0 78px;display:grid;grid-template-columns:300px 1fr auto;align-items:center;gap:18px;
  padding:10px 18px;background:linear-gradient(180deg,#11161a,#090c0f);border-bottom:1px solid #283038;box-shadow:0 4px 20px rgba(0,0,0,.35);z-index:20
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}.brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--orange)}
.brand-name{font-weight:950;font-size:19px;white-space:nowrap}.brand-sub{font-size:11px;font-weight:950;letter-spacing:4px;color:var(--orange);margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(88px,1fr));gap:8px;min-width:0}.metric{background:#11171c;border:1px solid #29323a;border-radius:9px;padding:7px 11px;min-width:0}.metric b{display:block;font-size:21px;line-height:1.05}.metric span{display:block;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;white-space:nowrap;margin-top:3px}.metric.warn b{color:var(--red)}.metric.live b{color:var(--green)}
.header-right{display:flex;align-items:center;gap:10px}.clock{text-align:right;white-space:nowrap}.clock-time{font-size:22px;font-weight:950}.clock-date{font-size:10px;color:var(--muted);font-weight:800;text-transform:capitalize}.online{display:flex;align-items:center;gap:6px;border:1px solid #245d3a;background:#0e2417;color:#72e39a;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:950;white-space:nowrap}.online i{width:7px;height:7px;border-radius:50%;background:#35d26f;box-shadow:0 0 9px #35d26f}
.toolbar{flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 18px;background:#0b0f12;border-bottom:1px solid #20272d}.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:7px}.filter{border:1px solid #303941;background:#151a1f;color:#cbd2d7;border-radius:7px;padding:7px 10px;font-size:11px;font-weight:900;cursor:pointer}.filter.active{background:#e9edf0;color:#111;border-color:#e9edf0}.sound{border:1px solid #39434b;background:#151a1f;color:#fff;border-radius:7px;padding:7px 11px;font-size:11px;font-weight:900;cursor:pointer}.sound.active{background:#173822;border-color:#2e7d4b;color:#8af0ad}.legend{font-size:10px;color:#7f8a93;font-weight:800}
.main{flex:1;min-height:0;padding:8px 8px 10px;display:flex;flex-direction:column;gap:9px}
.notice{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:40px;z-index:1000}.notice.show{display:flex}.notice-box{width:min(1100px,94vw);border:2px solid #ff8a1c;background:linear-gradient(180deg,#251609,#100b06);border-radius:18px;box-shadow:0 25px 90px rgba(0,0,0,.7);padding:34px 44px;text-align:center}.notice-icon{font-size:54px;line-height:1}.notice-label{font-size:15px;color:#ffad66;font-weight:950;letter-spacing:3px;margin-top:10px}.notice-text{font-size:clamp(34px,5vw,72px);font-weight:950;letter-spacing:.5px;line-height:1.05;margin-top:18px}.notice-age{font-size:12px;color:#858f97;font-weight:800;margin-top:20px}
.wall{
  flex:1;min-height:0;overflow:auto;display:grid;
  gap:8px;padding:2px 4px 9px;
  grid-template-columns:1fr;
  grid-template-rows:minmax(0,1fr);
  align-items:stretch;
  scrollbar-width:thin;scrollbar-color:#3c464e transparent;
}
.wall.layout-1{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}
.wall.layout-2{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.wall.layout-3{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.wall.layout-4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.wall.layout-5,.wall.layout-6{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.wall.layout-many{
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-auto-rows:minmax(420px,1fr);
  grid-template-rows:none;
  align-content:start;
}
.wall.layout-many .ticket{min-height:420px}

.ticket{background:linear-gradient(180deg,#f8fafb,#edf1f3);color:#111;border:2px solid #d3d9de;border-radius:11px;min-width:0;min-height:295px;height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.24);position:relative}.ticket.new{animation:newTicket .8s ease-in-out infinite}.ticket.pending{border-top:5px solid var(--yellow)}.ticket.cooking{border-top:5px solid var(--blue)}.ticket.ready{border-top:5px solid var(--green)}.ticket.urgent{border-top-color:var(--red);box-shadow:0 0 0 1px rgba(239,68,68,.25),0 6px 20px rgba(0,0,0,.28)}.ticket.delayed{border-top-color:#b91c1c;box-shadow:0 0 0 2px rgba(185,28,28,.25),0 6px 24px rgba(0,0,0,.3)}
@keyframes newTicket{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
.ticket-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:10px 11px 8px;border-bottom:1px solid #dbe0e4}.ticket-id{font-size:38px;line-height:.9;font-weight:950;letter-spacing:-1.5px}.status{font-size:10px;font-weight:950;padding:6px 8px;border-radius:6px;background:#e5e9ec;white-space:nowrap}.pending .status{background:#fff1ad}.cooking .status{background:#dceeff;color:#075f9f}.ready .status{background:#d9f7e5;color:#0c7a3d}.urgent .status,.delayed .status{background:#ffe0df;color:#b42318}
.ticket-meta{padding:9px 11px 9px;border-bottom:1px solid #e0e4e7}.destination-line{font-size:clamp(25px,1.8vw,34px);font-weight:950;line-height:1.02;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:block}.destination-line .customer-inline{font-weight:950}.time-row{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:8px}.age{font-size:13px;font-weight:950;color:#4b5560}.age.hot{color:#c21f1f}.scheduled{font-size:10px;font-weight:950;background:#fff2e4;color:#9a4b00;border-radius:5px;padding:4px 6px;white-space:nowrap}
.items{padding:7px 11px 2px;flex:1;min-height:0;overflow:hidden}.item{padding:10px 0;border-bottom:1px solid #e1e5e8}.item:last-child{border-bottom:0}.item-main{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:start}.qty{font-size:clamp(30px,2vw,40px);font-weight:950;text-align:left;line-height:1}.item-name{font-size:clamp(22px,1.55vw,31px);font-weight:950;line-height:1.05;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.details{font-size:clamp(15px,1vw,19px);color:#4b5560;font-weight:800;line-height:1.18;margin:6px 0 0 60px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.note{margin:6px 10px 8px;padding:7px 8px;border-left:4px solid var(--orange);background:#fff0df;border-radius:5px;color:#63310c;font-size:11px;font-weight:900;line-height:1.25}.ticket-actions{padding:8px 10px;background:#e7ebee;border-top:1px solid #d3d9de}.action{width:100%;border:0;border-radius:7px;padding:11px 10px;color:#fff;font-size:12px;font-weight:950;cursor:pointer;transition:.12s}.action:hover{filter:brightness(1.05)}.action:disabled{opacity:.55;cursor:wait}.action-start{background:linear-gradient(135deg,#ef8b18,#ff7a00)}.action-ready{background:linear-gradient(135deg,#087fd6,#1b9cf0)}.action-deliver{background:linear-gradient(135deg,#138c45,#20b15a)}
.empty{grid-column:1/-1;border:1px dashed #303940;border-radius:10px;padding:30px;text-align:center;color:#69747d;font-size:13px;font-weight:850}
.footer{flex:0 0 25px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#59636b;font-size:9px;font-weight:800;background:#080a0c;border-top:1px solid #1e252a}.footer strong{color:#7d878f}
@media(max-width:1250px){.header{grid-template-columns:260px 1fr}.header-right{grid-column:2;grid-row:1;justify-content:flex-end}.metrics{grid-column:1/-1;grid-row:2}.header{height:124px;flex-basis:124px}.toolbar{flex-basis:48px}}
@media(max-width:800px){html,body{overflow:auto}.header{height:auto;flex:none;grid-template-columns:1fr auto;padding:9px 11px}.metrics{grid-column:1/-1;grid-row:2;overflow:auto;grid-template-columns:repeat(5,100px)}.header-right{grid-column:2;grid-row:1}.online{display:none}.brand img{width:44px;height:44px}.brand-name{font-size:15px}.brand-sub{font-size:9px}.clock-time{font-size:18px}.toolbar{overflow:auto}.main{min-height:calc(100vh - 160px)}.wall,.wall.layout-1,.wall.layout-2,.wall.layout-3,.wall.layout-4,.wall.layout-5,.wall.layout-6,.wall.layout-many{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:minmax(295px,auto)}.wall .ticket,.wall.layout-many .ticket{height:auto;min-height:295px}.notice-text{font-size:18px}}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><img src="logo.jpg" alt="La Rotonda"><div><div class="brand-name">DRUGSTORE LA ROTONDA</div><div class="brand-sub">COCINA · KDS</div></div></div>
  <div class="metrics">
    <div class="metric"><b id="mTotal">0</b><span>Pedidos en cocina</span></div>
    <div class="metric"><b id="mPending">0</b><span>Sin iniciar</span></div>
    <div class="metric"><b id="mCooking">0</b><span>En marcha</span></div>
    <div class="metric live"><b id="mReady">0</b><span>Listos</span></div>
    <div class="metric warn"><b id="mDelayed">0</b><span>Demorados</span></div>
  </div>
  <div class="header-right"><div class="online"><i></i> EN LÍNEA</div><div class="clock"><div class="clock-time" id="clock">--:--</div><div class="clock-date" id="date">--</div></div></div>
</header>
<div class="toolbar">
  <div class="toolbar-left">
    <button class="filter active" data-filter="todos">TODOS</button><button class="filter" data-filter="pendiente">SIN INICIAR</button><button class="filter" data-filter="en_marcha">EN MARCHA</button><button class="filter" data-filter="listo">LISTOS</button>
  </div>
  <div class="toolbar-right"><span class="legend">Orden de llegada</span></div>
</div>
<main class="main">
  <div id="notice" class="notice"><div class="notice-box"><div class="notice-icon">📢</div><div class="notice-label">MENSAJE DE COMANDAS</div><div id="noticeText" class="notice-text"></div><div id="noticeAge" class="notice-age"></div></div></div>
  <section id="wall" class="wall"></section>
</main>
<footer class="footer"><span>COMANDA 2.0 · <strong>KDS LA ROTONDA</strong></span><span id="connectionText">Tiempo real · SSE</span></footer>
<script>
const PREP_MIN = 20;
let pedidos = [];
let filtro = "todos";
let soundEnabled = false;
let audioCtx = null;
let soundUnlockShown = false;
const pendingSoundTimers = new Map();
const SOUND_REPEAT_MS = 60000;
let noticeTimer = null;
let noticeStartedAt = null;
let noticeText = "";
const wall = document.getElementById("wall");

function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function nowMs(){return Date.now()}
function pedidoAgeMin(p){return Math.max(0,Math.floor((nowMs()-new Date(p.creadoAt).getTime())/60000))}
function fmtAge(p){const m=pedidoAgeMin(p);return m<=0?"AHORA":`Hace ${m} ${m===1?"minuto":"minutos"}`}
function fmtTime(iso){return iso?new Intl.DateTimeFormat("es-AR",{timeZone:"America/Argentina/Buenos_Aires",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(iso)):""}
function isScheduledNow(p){if(p.modoRetiro!=="programado"||!p.retiroAt)return false;return new Date(p.retiroAt).getTime()-nowMs()<=PREP_MIN*60000}
function urgency(p){
  if(p.estado==="listo") return {rank:50,cls:"ready",label:"LISTO"};
  const age=pedidoAgeMin(p);
  if(p.modoRetiro==="programado"&&p.retiroAt){const diff=(new Date(p.retiroAt).getTime()-nowMs())/60000;if(diff<0)return {rank:0,cls:"delayed",label:"DEMORADO"};if(diff<=10)return {rank:1,cls:"urgent",label:"URGENTE"};if(diff<=PREP_MIN)return {rank:2,cls:"pending",label:"PREPARAR AHORA"}}
  if(age>=30)return {rank:3,cls:"delayed",label:"DEMORADO"};
  if(age>=20)return {rank:4,cls:p.estado==="en_marcha"?"cooking":"urgent",label:p.estado==="en_marcha"?"EN MARCHA":"ATENCIÓN"};
  return p.estado==="en_marcha"?{rank:20,cls:"cooking",label:"EN MARCHA"}:{rank:10,cls:"pending",label:"SIN INICIAR"};
}
function sortTickets(list){return [...list].sort((a,b)=>{const ua=urgency(a),ub=urgency(b);if(ua.rank!==ub.rank)return ua.rank-ub.rank;const ta=a.estado==="listo"?(a.listoAt||a.creadoAt):a.creadoAt;const tb=b.estado==="listo"?(b.listoAt||b.creadoAt):b.creadoAt;return new Date(ta)-new Date(tb)})}
function productDetails(p){const d=[];if(p.preparacion)d.push(p.preparacion);if(p.tostado)d.push(p.tostado);if(p.guarnicion)d.push("Guarnición: "+p.guarnicion);d.push(...(p.modificaciones||[]));d.push(...(p.adicionales||[]).map(x=>"+ "+x));return d}
function renderTicket(p){
  const u=urgency(p);const scheduled=p.modoRetiro==="programado"&&p.retiroAt;const age=pedidoAgeMin(p);const hot=age>=20;
  const action=p.estado==="pendiente"?`<button class="action action-start" onclick="changeState(${p.id},'marchar',this)">▶ INICIAR PREPARACIÓN</button>`:p.estado==="en_marcha"?`<button class="action action-ready" onclick="changeState(${p.id},'listo',this)">✓ PEDIDO LISTO</button>`:`<button class="action action-deliver" onclick="changeState(${p.id},'entregado',this)">📦 ENTREGADO</button>`;
  const items=(Array.isArray(p.productos)?p.productos:[]).map(x=>{const d=productDetails(x);return `<div class="item"><div class="item-main"><div class="qty">${Number(x.cantidad)||0}</div><div class="item-name">${escapeHtml(x.nombre||"")}</div></div>${d.length?`<div class="details">${d.map(escapeHtml).join(" · ")}</div>`:""}</div>`}).join("");
  return `<article class="ticket ${u.cls} ${p.estado==="pendiente"?"new":""}" data-id="${p.id}">
    <div class="ticket-top"><div class="ticket-id">#${escapeHtml(p.numero)}</div><div class="status">${u.label}</div></div>
    <div class="ticket-meta"><div class="destination-line">${escapeHtml(p.destino||"")}${p.cliente?` <span class="customer-inline">— ${escapeHtml(p.cliente)}</span>`:""}</div><div class="time-row"><span class="age ${hot?'hot':''}">⏱ ${fmtAge(p)}</span>${scheduled?`<span class="scheduled">RETIRO ${fmtTime(p.retiroAt)}</span>`:""}</div></div>
    <div class="items">${items||'<div class="empty">Sin productos</div>'}</div>${p.observacion?`<div class="note">⚠ ${escapeHtml(p.observacion)}</div>`:""}<div class="ticket-actions">${action}</div>
  </article>`;
}
function render(){
  const activos=pedidos.filter(p=>p.estado!=="entregado"&&p.estado!=="anulado");
  const filtered=filtro==="todos"?activos:activos.filter(p=>p.estado===filtro);

  wall.className="wall";
  if(filtered.length>=1 && filtered.length<=6){
    wall.classList.add(`layout-${filtered.length}`);
  }else if(filtered.length>6){
    wall.classList.add("layout-many");
  }

  wall.innerHTML=filtered.length?filtered.map(renderTicket).join(""):'<div class="empty">No hay pedidos para mostrar.</div>';
  const delayed=activos.filter(p=>urgency(p).cls==="delayed").length;
  document.getElementById("mTotal").textContent=activos.length;
  document.getElementById("mPending").textContent=activos.filter(p=>p.estado==="pendiente").length;
  document.getElementById("mCooking").textContent=activos.filter(p=>p.estado==="en_marcha").length;
  document.getElementById("mReady").textContent=activos.filter(p=>p.estado==="listo").length;
  document.getElementById("mDelayed").textContent=delayed;
}
function replacePedido(p){const i=pedidos.findIndex(x=>x.id===p.id);if(i<0)pedidos.push(p);else pedidos[i]=p}
async function changeState(id,state,btn){
  if(btn){btn.disabled=true;btn.textContent="ACTUALIZANDO…"}
  try{const r=await fetch(`/api/pedidos/${id}/${state}`,{method:"POST"});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.mensaje||"No se pudo actualizar el pedido");if(data.pedido)replacePedido(data.pedido);render()}catch(e){console.error(e);alert(e.message||"No se pudo actualizar el pedido.");render()}
}
function crearAudio(){
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended"){
      const r=audioCtx.resume();
      if(r&&typeof r.catch==="function")r.catch(()=>{});
    }
    soundEnabled=audioCtx.state==="running";
    return soundEnabled;
  }catch(e){
    console.error("No se pudo iniciar el audio:",e);
    return false;
  }
}

function mostrarAvisoSonido(){
  if(soundUnlockShown)return;
  soundUnlockShown=true;
  const aviso=document.createElement("div");
  aviso.id="soundUnlock";
  aviso.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:30px;z-index:2000;";
  aviso.innerHTML='<button type="button" style="border:2px solid #ff8a1c;background:#251609;color:#fff;border-radius:16px;padding:22px 30px;font-size:clamp(20px,3vw,34px);font-weight:950;cursor:pointer;box-shadow:0 15px 60px rgba(0,0,0,.55)">🔊 ACTIVAR SONIDO DE COCINA</button>';
  aviso.querySelector("button").addEventListener("click",()=>{
    crearAudio();
    if(audioCtx&&audioCtx.state==="running"){
      aviso.remove();
      sonidoCampana();
    }
  });
  document.body.appendChild(aviso);
}

function sonidoCampana(){
  if(!crearAudio())return;
  const t=audioCtx.currentTime;
  const notas=[
    {f:880,at:0.00,d:0.85},
    {f:1174,at:0.48,d:0.95},
    {f:1397,at:0.72,d:1.35}
  ];
  notas.forEach(n=>{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    const filtroAudio=audioCtx.createBiquadFilter();
    o.type="sine";
    o.frequency.setValueAtTime(n.f,t+n.at);
    o.frequency.exponentialRampToValueAtTime(n.f*0.985,t+n.at+n.d);
    filtroAudio.type="lowpass";
    filtroAudio.frequency.setValueAtTime(3200,t+n.at);
    g.gain.setValueAtTime(0.0001,t+n.at);
    g.gain.exponentialRampToValueAtTime(0.20,t+n.at+0.025);
    g.gain.exponentialRampToValueAtTime(0.0001,t+n.at+n.d);
    o.connect(filtroAudio);
    filtroAudio.connect(g);
    g.connect(audioCtx.destination);
    o.start(t+n.at);
    o.stop(t+n.at+n.d+0.03);
  });
}

function programarSonidoPedido(p){
  if(!p||p.estado!=="pendiente")return;
  if(pendingSoundTimers.has(p.id))return;
  const timer=setInterval(()=>{
    const actual=pedidos.find(x=>x.id===p.id);
    if(!actual||actual.estado!=="pendiente"){
      clearInterval(timer);
      pendingSoundTimers.delete(p.id);
      return;
    }
    sonidoCampana();
  },SOUND_REPEAT_MS);
  pendingSoundTimers.set(p.id,timer);
}

function detenerSonidoPedido(id){
  const timer=pendingSoundTimers.get(id);
  if(timer){
    clearInterval(timer);
    pendingSoundTimers.delete(id);
  }
}

document.addEventListener("pointerdown",()=>{
  if(!crearAudio()&& !soundUnlockShown)mostrarAvisoSonido();
},{once:true});
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");filtro=b.dataset.filter;render()});
function showNotice(texto){noticeText=String(texto||"").trim();if(!noticeText)return;noticeStartedAt=Date.now();clearTimeout(noticeTimer);document.getElementById("noticeText").textContent=noticeText;document.getElementById("noticeAge").textContent="AHORA";document.getElementById("notice").classList.add("show");noticeTimer=setTimeout(()=>{document.getElementById("notice").classList.remove("show");noticeText=""},8000)}
function updateNoticeAge(){if(!noticeStartedAt||!noticeText)return;const s=Math.max(0,Math.floor((Date.now()-noticeStartedAt)/1000));document.getElementById("noticeAge").textContent=s<60?`Hace ${s}s`:`Hace ${Math.floor(s/60)}m`}
function connect(){const es=new EventSource("/api/cocina");document.getElementById("connectionText").textContent="Tiempo real · conectando…";es.onopen=()=>document.getElementById("connectionText").textContent="Tiempo real · conectado";es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.tipo==="inicio"){pedidos=d.pedidos||[];render();pedidos.filter(p=>p.estado==="pendiente").forEach(programarSonidoPedido);crearAudio();return}if(d.tipo==="nuevo"){replacePedido(d.pedido);render();sonidoCampana();programarSonidoPedido(d.pedido);return}if(d.tipo==="estado"&&d.pedido){replacePedido(d.pedido);if(d.pedido.estado==="pendiente")programarSonidoPedido(d.pedido);else detenerSonidoPedido(d.pedido.id);if(d.pedido.estado==="entregado"||d.pedido.estado==="anulado")pedidos=pedidos.filter(p=>p.id!==d.pedido.id);render();return}if(d.tipo==="mensaje"){showNotice(d.mensaje);sonidoCampana();return}if(d.tipo==="error")console.error(d.mensaje)}catch(err){console.error(err)}};es.onerror=()=>document.getElementById("connectionText").textContent="Tiempo real · reconectando…"}
connect();
setInterval(()=>{render();updateNoticeAge()},10000);
setInterval(()=>{const n=new Date();document.getElementById("clock").textContent=new Intl.DateTimeFormat("es-AR",{timeZone:"America/Argentina/Buenos_Aires",hour:"2-digit",minute:"2-digit",hour12:false}).format(n);document.getElementById("date").textContent=new Intl.DateTimeFormat("es-AR",{timeZone:"America/Argentina/Buenos_Aires",weekday:"short",day:"2-digit",month:"short"}).format(n)},1000);
render();
crearAudio();
if(!soundEnabled)mostrarAvisoSonido();
</script>
</body>
</html>
