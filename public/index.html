<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comandas - Drugstore La Rotonda</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f3f3;color:#111}
header{background:#111;color:#fff;padding:14px 24px;font-size:25px;font-weight:800;min-height:66px}
.contenedor{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;padding:16px;max-width:1600px;margin:auto;align-items:start}
.panel{background:#fff;border-radius:14px;padding:16px;box-shadow:0 3px 14px rgba(0,0,0,.08)}
h2{margin:0 0 12px;font-size:24px}
.subtitulo{font-size:18px;font-weight:800;margin:14px 0 9px}
.destinos-principales{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.destino,.destino-llevar{border:0;border-radius:10px;padding:13px 8px;font-size:17px;font-weight:800;cursor:pointer;background:#e8e8e8}
.destino.seleccionado,.destino-llevar.seleccionado{background:#111;color:#fff}
.destino-llevar{width:100%;margin-top:9px;background:#dedede}
.destino-llevar.seleccionado{background:#111}
#mesasExtra{display:none;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px}
#mesasExtra.visible{display:grid}
#mesasExtra .destino{padding:10px 5px;font-size:15px}
#botonMasMesas{margin-top:8px;width:100%;border:1px solid #bbb;background:#fff;border-radius:10px;padding:10px;font-weight:800;cursor:pointer}
#botonMasMesas.activo{background:#eee}
.categorias{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
.categoria{border:0;border-radius:9px;padding:10px 14px;background:#e8e8e8;font-weight:800;cursor:pointer;font-size:15px}
.categoria.seleccionada{background:#111;color:#fff}
.productos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.producto{min-height:66px;border:1px solid #ddd;background:#fff;border-radius:11px;padding:11px;font-size:17px;font-weight:800;cursor:pointer}
.producto:hover{background:#f2f2f2}
.pedido-panel{position:sticky;top:12px;height:max-content}
.destino-actual{background:#f0f0f0;border-radius:10px;padding:12px;font-weight:800;margin-bottom:10px}
.campo{margin-bottom:11px}
.campo label{display:block;font-weight:800;margin-bottom:5px}
input,textarea,select{width:100%;border:1px solid #bbb;border-radius:9px;padding:10px;font-size:16px;background:#fff}
.retiro-opciones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.retiro-opcion{border:1px solid #bbb;background:#eee;border-radius:9px;padding:10px;font-weight:800;cursor:pointer;text-align:center}
.retiro-opcion.activa{background:#111;color:#fff;border-color:#111}
#programadoBox{display:none;background:#f7f7f7;border-radius:10px;padding:9px;margin-top:7px}
#programadoBox.visible{display:block}
.retiro-fecha-hora{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lista-pedido{max-height:330px;overflow:auto;margin-bottom:10px}
.item-pedido{border:1px solid #ddd;border-radius:10px;padding:11px;margin-bottom:8px}
.item-pedido strong{display:block;font-size:16px}
.modificaciones{font-size:13px;margin-top:5px;line-height:1.4}
.editar,.eliminar{border:0;border-radius:7px;padding:7px 10px;margin-top:8px;font-weight:800;cursor:pointer}
.editar{background:#e5e5e5}
.eliminar{background:#ddd}
textarea{resize:vertical;min-height:76px}
#enviar{width:100%;border:0;border-radius:10px;background:#111;color:#fff;padding:15px;font-size:18px;font-weight:900;cursor:pointer}
#mensaje{font-weight:800;margin-top:9px;min-height:20px}
#modalFondo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:15px;z-index:20}
.modal{background:#fff;border-radius:15px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:20px}
.modal h2{margin-bottom:8px}
.receta{font-size:14px;background:#f3f3f3;border-radius:8px;padding:9px;margin-bottom:10px}
.opcion{display:flex;align-items:center;gap:10px;border:1px solid #ddd;border-radius:9px;padding:11px;margin-bottom:7px;cursor:pointer}
.opcion input{width:auto;transform:scale(1.25)}
.guarniciones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.guarnicion{min-height:60px;font-size:17px;font-weight:bold;padding:12px;background:#eee;border:0;border-radius:9px;cursor:pointer}
.guarnicion.seleccionada{background:#111;color:#fff}
.acciones-modal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.acciones-modal button{min-height:60px;font-size:18px;font-weight:bold;padding:12px;border:0;border-radius:9px;cursor:pointer}
#cancelarModal{background:#ddd}
#confirmarModal{background:#111;color:#fff}
.modal .rapido{min-height:60px;font-size:18px;font-weight:bold;padding:12px;background:#eee;border:0;border-radius:9px;cursor:pointer}
#pedidosHoyBox{max-width:1600px!important}
@media(max-width:1050px){.contenedor{grid-template-columns:1fr}.pedido-panel{position:static}.destinos-principales{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){header{font-size:20px;padding:12px 14px}.contenedor{padding:10px}.productos{grid-template-columns:1fr 1fr}.destinos-principales{grid-template-columns:repeat(2,1fr)}.categoria{padding:10px 11px;font-size:14px}}
</style>

<style>

#botonMasMesas{border-color:#ddd;color:#333;transition:.16s}.destino-llevar{background:#fff7ef;border-color:#ffd5b0;color:#d96500;font-size:17px}.destino-llevar.seleccionado{background:var(--naranja);color:#fff}
.categorias{gap:7px;margin:0 0 12px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}.categoria{border:1px solid #e4e4e4;border-radius:11px;padding:11px 13px;background:#f0f1f2;white-space:nowrap;transition:.16s}.categoria:hover{background:#e7e7e7;transform:translateY(-1px)}.categoria.seleccionada{background:#111;color:#fff;border-color:#111;box-shadow:0 4px 12px rgba(0,0,0,.12)}

.pedido-panel{top:100px}.pedido-panel .seccion-titulo{justify-content:space-between}.destino-actual{background:linear-gradient(135deg,#f7f7f7,#eeeeee);border:1px solid #e4e4e4;border-radius:12px;padding:14px;margin-bottom:12px}.lista-pedido{max-height:350px}.item-pedido{border:1px solid #e3e3e3;border-radius:13px;padding:12px;margin-bottom:9px;background:#fff;box-shadow:0 2px 9px rgba(0,0,0,.035)}.item-pedido strong{font-size:17px}.modificaciones{color:#666;background:#fafafa;border-radius:8px;padding:6px 8px}.editar,.eliminar{border-radius:8px}.editar{background:#f0f0f0}.eliminar{background:#fff0f0;color:#a11}
.campo label{font-size:15px}.opcional-label{font-weight:600;color:#999;font-size:12px}input,textarea,select{border-color:#ddd;box-shadow:inset 0 1px 2px rgba(0,0,0,.025)}input:focus,textarea:focus,select:focus{outline:2px solid rgba(255,122,0,.16);border-color:#ff9b45}textarea{min-height:88px}

.pedidos-hoy-panel{max-width:1700px!important}.pedidos-hoy-titulo{font-size:21px;font-weight:950;margin-bottom:12px}.pedidos-hoy-titulo .titulo-icono{margin-right:4px}

@media(max-width:1150px){.app-header{grid-template-columns:1fr auto}.fecha-hora-header{grid-column:1/-1;grid-row:2;justify-content:flex-start}.acciones-header{grid-column:2;grid-row:1}.contenedor{grid-template-columns:1fr}.pedido-panel{position:static}.productos{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style>

<style>
.pedido-activo-card{border:1px solid #e3e3e3;border-radius:14px;padding:13px;margin-bottom:10px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.045);position:relative;overflow:hidden}.pedido-activo-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#bbb}.pedido-activo-card.estado-pendiente:before{background:#f2c94c}.pedido-activo-card.estado-en_marcha:before{background:#238be0}.pedido-activo-card.estado-listo:before{background:#20a050}.pedido-activo-cabecera{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}.pedido-activo-numero{font-size:22px}.pedido-activo-estado{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#eee}.estado-pendiente .pedido-activo-estado{background:#fff4bd}.estado-en_marcha .pedido-activo-estado{background:#e1f1ff;color:#1268a9}.estado-listo .pedido-activo-estado{background:#def7e7;color:#11743a}.pedido-activo-destino{font-weight:900;margin-bottom:7px}.pedido-activo-productos{font-size:14px;line-height:1.45;padding:8px 9px;background:#f7f8f9;border-radius:9px}.pedido-activo-observacion{background:#fff4e8;border-left:4px solid var(--naranja);padding:7px 9px;margin-top:8px;font-size:13px;border-radius:7px}.pedido-activo-entregar{width:100%;padding:11px;border:0;border-radius:9px;background:#169447;color:#fff;font-weight:900;cursor:pointer;margin-top:9px}.pedido-activo-anular{width:100%;padding:9px;border:1px solid #f0caca;border-radius:9px;background:#fff7f7;color:#b42318;font-weight:800;cursor:pointer;margin-top:8px}.pedido-activo-anular:hover{background:#fff0f0}
</style>
</head>
<body>
<header class="app-header">
    <div class="marca-header">
        <img class="logo-header" src="logo.jpg" alt="Drugstore La Rotonda">
        <div>
            <div class="marca-nombre">DRUGSTORE LA ROTONDA</div>
            <div class="marca-subtitulo">COMANDAS</div>
        </div>
    </div>
    <div class="fecha-hora-header">
        <div class="fecha-header"><span class="fecha-icono">▣</span><span id="fechaActual"></span></div>
        <div class="hora-header"><span class="hora-icono">◷</span><span id="horaActual">--:--</span></div>
    </div>
    <div class="acciones-header">
        <button id="irCocina" class="btn-header btn-cocina" type="button" onclick="window.open('/cocina.html', '_blank')">🍳 COCINA</button>
        <button id="cerrarSesion" class="btn-header btn-sesion" type="button">Cerrar sesión</button>
    </div>
</header>

<div class="contenedor">
<main class="panel">
<h2 class="seccion-titulo"><span class="titulo-icono">⌖</span>Destino</h2>

<div class="destinos-principales">
<button class="destino" data-destino="Mesa 1">Mesa 1</button>
<button class="destino" data-destino="Mesa 2">Mesa 2</button>
<button class="destino" data-destino="Mesa 3">Mesa 3</button>
<button class="destino" data-destino="Mesa 4">Mesa 4</button>
<button class="destino" data-destino="Mesa 5">Mesa 5</button>
<button class="destino" data-destino="Mesa 6">Mesa 6</button>
</div>

<div id="mesasExtra">
<button class="destino" data-destino="Mesa 7">Mesa 7</button>
<button class="destino" data-destino="Mesa 8">Mesa 8</button>
<button class="destino" data-destino="Mesa 9">Mesa 9</button>
<button class="destino" data-destino="Mesa 10">Mesa 10</button>
<button class="destino" data-destino="Mesa 11">Mesa 11</button>
<button class="destino" data-destino="Mesa 12">Mesa 12</button>
<button class="destino" data-destino="Mesa 13">Mesa 13</button>
<button class="destino" data-destino="Mesa 14">Mesa 14</button>
<button class="destino" data-destino="Mesa 15">Mesa 15</button>
<button class="destino" data-destino="Mesa 16">Mesa 16</button>
<button class="destino" data-destino="Mesa 17">Mesa 17</button>
<button class="destino" data-destino="Mesa 18">Mesa 18</button>
<button class="destino" data-destino="Mesa 19">Mesa 19</button>
<button class="destino" data-destino="Mesa 20">Mesa 20</button>
</div>

<button id="botonMasMesas">+ MÁS MESAS</button>
<button class="destino-llevar" data-destino="Para llevar">🛍️ PARA LLEVAR</button>

<div class="subseccion-titulo"><span>🍽️</span> Categorías</div>
<div class="categorias">
<button class="categoria" data-categoria="empanadas">🥟 Empanadas</button>
<button class="categoria" data-categoria="sandwiches">🥪 Sándwiches</button>
<button class="categoria" data-categoria="hamburguesas">🍔 Hamburguesas</button>
<button class="categoria" data-categoria="platos">🍽️ Al plato</button>
<button class="categoria" data-categoria="miga">🥪 Miga</button>
<button class="categoria" data-categoria="baguettes">🥖 Baguettes</button>
<button class="categoria" data-categoria="tartas">🥧 Tartas</button>
<button class="categoria" data-categoria="pizzas">🍕 Pizzas</button>
<button class="categoria" data-categoria="bebidas">🥤 Bebidas</button>
</div>

<div id="productos" class="productos"></div>
</main>

<aside class="panel pedido-panel">
<h2 class="seccion-titulo comanda-titulo"><span class="titulo-icono">▤</span>Comanda </h2>
<div id="pedidoDestino" class="destino-actual">Seleccioná una mesa o Para llevar</div>

<div id="clienteBox" class="campo" style="display:none">
<label for="cliente">Nombre y apellido</label>
<input id="cliente" type="text" placeholder="Ej.: María González" autocomplete="off">
</div>

<div id="retiroBox" class="campo" style="display:none">
<label>Retiro</label>
<div class="retiro-opciones">
<button type="button" class="retiro-opcion activa" data-modo="ahora">AHORA</button>
<button type="button" class="retiro-opcion" data-modo="programado">PROGRAMADO</button>
</div>

<div id="programadoBox">
<div class="retiro-fecha-hora">
<div>
<label for="retiroFecha">Fecha</label>
<input id="retiroFecha" type="date">
</div>
<div>
<label for="retiroHora">Hora</label>
<input id="retiroHora" type="time">
</div>
</div>
</div>
</div>

<div id="listaPedido" class="lista-pedido"><p>No hay productos agregados.</p></div>

<div class="campo">
<label for="observacion"><span class="label-icono">▤</span> Observación <span class="opcional-label">(opcional)</span></label>
<textarea id="observacion" placeholder="Indicaciones generales para cocina..."></textarea>
</div>

<button id="enviar">ENVIAR A COCINA</button>
<div id="mensaje"></div>
</aside>
</div>

<div id="pedidosHoyBox" class="panel pedidos-hoy-panel" style="max-width:1500px;margin:0 auto 18px;">
<div class="pedidos-hoy-titulo"><span><span class="titulo-icono">◷</span> Pedidos de hoy</span></div>
<div id="pedidosHoyLista"><div style="color:#777;">Cargando pedidos...</div></div>
</div>

<div id="modalFondo">
<div class="modal">
<h2 id="modalTitulo"></h2>
<div id="modalContenido"></div>
<div class="acciones-modal">
<button id="cancelarModal">Cancelar</button>
<button id="confirmarModal">Agregar</button>
</div>
</div>
</div>

<script src="app.js"></script>
<script>
(function(){
  const fecha=document.getElementById("fechaActual");
  const hora=document.getElementById("horaActual");
  function actualizar(){
    const ahora=new Date();
    if(fecha) fecha.textContent=new Intl.DateTimeFormat("es-AR",{timeZone:"America/Argentina/Buenos_Aires",weekday:"long",day:"2-digit",month:"long",year:"numeric"}).format(ahora).replace(/^./,c=>c.toUpperCase());
    if(hora) hora.textContent=new Intl.DateTimeFormat("es-AR",{timeZone:"America/Argentina/Buenos_Aires",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(ahora);
  }
  actualizar(); setInterval(actualizar,1000);
})();
</script>
</body>
