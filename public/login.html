<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comanda 2.0 - Acceso</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .login {
            width: 100%;
            max-width: 380px;
            margin: 20px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 26px;
        }

        .subtitulo {
            margin: 0 0 25px;
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #mensaje {
            min-height: 20px;
            margin-top: 15px;
            text-align: center;
            color: #c62828;
        }
    </style>
</head>

<body>

    <main class="login">

        <h1>Comanda 2.0</h1>
        <p class="subtitulo">Acceso al sistema</p>

        <form id="loginForm">

            <label for="usuario">Usuario</label>
            <input
                id="usuario"
                type="text"
                autocomplete="username"
                required
            >

            <label for="password">Contraseña</label>
            <input
                id="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button id="boton" type="submit">
                Ingresar
            </button>

            <div id="mensaje"></div>

        </form>

    </main>

    <script>
        const formulario = document.getElementById("loginForm");
        const boton = document.getElementById("boton");
        const mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", async (event) => {
            event.preventDefault();

            mensaje.textContent = "";
            boton.disabled = true;
            boton.textContent = "Ingresando...";

            const usuario = document.getElementById("usuario").value.trim();
            const password = document.getElementById("password").value;

            try {
                const respuesta = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        usuario,
                        password
                    })
                });

                const datos = await respuesta.json();

                if (!respuesta.ok || !datos.ok) {
                    mensaje.textContent =
                        datos.mensaje || "No se pudo iniciar sesión.";

                    boton.disabled = false;
                    boton.textContent = "Ingresar";
                    return;
                }

                const parametros = new URLSearchParams(window.location.search);
                const destino = parametros.get("redirect") || "/";

                    window.location.href = destino;

            } catch (error) {
                mensaje.textContent =
                    "No se pudo conectar con el servidor.";

                boton.disabled = false;
                boton.textContent = "Ingresar";
            }
        });
    </script>

</body>
</html>
